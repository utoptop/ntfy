services:
  ntfy:
    image: utoptop/ntfy:main
    restart: unless-stopped
    command: serve
    environment:
      # Optional environment pass-through; set the address when deploying.
      # If unset, server.yml can provide base-url instead.
      NTFY_BASE_URL:
      # Set these here or in server.yml; environment variables take precedence.
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_ENABLE_LOGIN: "true"
      NTFY_CACHE_DURATION: 24h
      NTFY_WORKER_THREADS: 2
      NTFY_VISITOR_REQUEST_LIMIT_BURST: 120
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ntfy-data:/var/lib/ntfy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  ntfy-data:
