# Optional /etc/ntfy/server.yml. Environment variables take precedence.
listen-http: 0.0.0.0:8080
# Set your external URL at deployment time for Matrix/attachment links.
base-url: ""
cache-file: /var/lib/ntfy/cache.db
cache-duration: 24h
cache-max-messages: 100000
attachment-cache-dir: /var/lib/ntfy/attachments
attachment-file-size-limit: 15728640
attachment-total-size-limit: 1073741824
attachment-expiry-duration: 3h
message-size-limit: 4096
keepalive-interval: 45s
subscriber-buffer-size: 256
subscription-limit: 10000
visitor-subscription-limit: 30
visitor-request-limit-burst: 120
visitor-request-limit-replenish: 5s
replay-limit: 1000
replay-bytes-limit: 1048576
worker-threads: 2
web-root: /usr/share/ntfy/web
auth-file: /var/lib/ntfy/auth.db
enable-login: true
enable-signup: false
auth-default-access: read-write
# For a private server, set auth-default-access: deny-all and grant access:
# auth-users:
#   - 'phone:$2b$10$...generated with ntfy user hash...:user'
# auth-access:
#   - 'everyone:up*:write-only'
#   - 'phone:up*:read-write'
# behind-proxy: true
# proxy-forwarded-header: X-Forwarded-For
# proxy-trusted-hosts: "10.0.0.0/8"
# iOS wakeups require base-url above (or NTFY_BASE_URL at runtime):
# upstream-base-url: https://ntfy.sh
