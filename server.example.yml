# Optional /etc/ntfy/server.yml. Environment variables take precedence.
listen-http: 0.0.0.0:8080
base-url: https://ntfy.aosn.de
cache-file: /var/lib/ntfy/cache.db
cache-duration: 24h
cache-max-messages: 100000
attachment-cache-dir: /var/lib/ntfy/attachments
attachment-file-size-limit: 15728640
attachment-total-size-limit: 1073741824
attachment-expiry-duration: 3h
message-size-limit: 4096
keepalive-interval: 45s
subscriber-buffer-size: 256
subscription-limit: 10000
visitor-subscription-limit: 30
visitor-request-limit-burst: 120
visitor-request-limit-replenish: 5s
replay-limit: 1000
replay-bytes-limit: 1048576
worker-threads: 2
web-root: /usr/share/ntfy/web
auth-default-access: deny-all
auth-access:
  - user: '*'
    topic: 'up*'
    permission: read-write
# For private subscriptions, change the everyone rule above to write-only,
# add a user here and grant that user read-write on up*. Keep anonymous writes
# allowed: your Matrix homeserver does not know the phone's ntfy credentials.
# auth-users:
#   - name: phone
#     password-hash: '$argon2id$...generated by ntfy hash-password...'
#     token-hashes: []
#     admin: false
# auth-access:
#   - { user: '*', topic: 'up*', permission: write-only }
#   - { user: phone, topic: 'up*', permission: read-write }
